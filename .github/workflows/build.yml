name: Build IPA with nxnative

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang
          pip3 install --break-system-packages gdown

      - name: Setup Game Files and Keys
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
          GAME_URL: ${{ secrets.GAME_URL }}
          UPDATE_URL: ${{ secrets.UPDATE_URL }}
        run: |
          mkdir -p game_files
          echo "$PROD_KEYS" > prod.keys

          # Descarga del juego base
          gdown --fuzzy "$GAME_URL" -O game_files/base.nsp

          # Descarga de la actualización
          gdown --fuzzy "$UPDATE_URL" -O game_files/update.nsp

          # Muestra en consola el tamaño de los archivos para verificar que se descargaron completos
          ls -lh game_files/

      - name: Run build script
        run: |
          python3 scripts/build_ipa_from_nsp.py game_files -k prod.keys

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-ipa
          path: game_files/*.ipa
          retention-days: 1
