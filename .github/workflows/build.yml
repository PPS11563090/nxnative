name: Build IPA with nxnative

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang
          pip3 install --break-system-packages gdown lz4 capstone fonttools

      - name: Setup Game Files and Keys
        env:
          KEYS_ID: ${{ secrets.KEYS_URL }}
          TITLE_KEYS_ID: ${{ secrets.TITLE_KEYS_URL }}
          GAME_ID: ${{ secrets.GAME_URL }}
          UPDATE_ID: ${{ secrets.UPDATE_URL }}
        run: |
          mkdir -p game_files
          
          # Crear la carpeta donde el extractor busca las llaves por defecto
          mkdir -p ~/.switch

          # Descargar prod.keys y copiarlo
          gdown "$KEYS_ID" -O prod.keys
          cp prod.keys ~/.switch/prod.keys

          # Descargar title.keys y copiarlo
          gdown "$TITLE_KEYS_ID" -O title.keys
          cp title.keys ~/.switch/title.keys

          # Descargar el juego base
          gdown "$GAME_ID" -O game_files/base.nsp

          # Descargar la actualización (si pusiste el ID)
          if [ -n "$UPDATE_ID" ]; then
            gdown "$UPDATE_ID" -O game_files/update.nsp
          fi

      - name: Run build script
        run: |
          python3 scripts/build_ipa_from_nsp.py game_files -k prod.keys

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-ipa
          path: game_files/*.ipa
          retention-days: 1
