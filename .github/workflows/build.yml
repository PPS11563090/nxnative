name: Build IPA with nxnative

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang
          pip3 install --break-system-packages gdown

      - name: Setup Game Files and Keys
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
          GAME_ID: ${{ secrets.GAME_URL }}
          UPDATE_ID: ${{ secrets.UPDATE_URL }}
        run: |
          mkdir -p game_files
          echo "$PROD_KEYS" > prod.keys

          # Descargar el juego base usando solo el ID
          gdown "$GAME_ID" -O game_files/base.nsp

          # Descargar la actualización (si pusiste el ID)
          if [ -n "$UPDATE_ID" ]; then
            gdown "$UPDATE_ID" -O game_files/update.nsp
          fi

          # Mostrar el tamaño de los archivos para confirmar la descarga
          ls -lh game_files/

      - name: Run build script
        run: |
          python3 scripts/build_ipa_from_nsp.py game_files -k prod.keys

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-ipa
          path: game_files/*.ipa
          retention-days: 1
